name: Starttrips quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, starttrips-production-polish]

permissions:
  contents: read

concurrency:
  group: starttrips-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify images, content, types, production build and browsers
        run: npm run verify
